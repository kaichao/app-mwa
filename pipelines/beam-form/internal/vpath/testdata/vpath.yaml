# vpath 测试配置
#
# 池的成员不在配置里声明——完全由信号量组 vpath:free-gb:<pool> 决定，
# 由管理员用 sema 文件导入（测试中由 newTestStore 预置）。
classes:
  # 纯路径类：读场景，数据已存在于所有目标分区（类型 b1）
  read-class:
    targets:
      - path: "/data/partition-a"
        weight: 1.0
      - path: "/data/partition-b"
        weight: 1.0

  # 纯池类：写场景，委托给存储池分配（类型 a）
  write-class:
    unit_size_gb: 10
    targets:
      - pool: test-pool
        weight: 1.0

  # 混合类：路径 + 池
  mixed-class:
    unit_size_gb: 20
    targets:
      - path: "/fast/ssd"
        weight: 2.0
      - pool: test-pool
        weight: 3.0

  # 多池类（类型 b2）：两个池的容量相加
  multi-pool:
    unit_size_gb: 10
    targets:
      - pool: test-pool
        weight: 1.0
      - pool: big-pool
        weight: 2.0

  # 权重为 0 的目标不参与选择
  disabled-target:
    targets:
      - path: "/data/primary"
        weight: 1.0
      - path: "/data/backup"
        weight: 0.0

pools:
  test-pool:
    strategy: max-free

  big-pool:
    strategy: max-free

# vpath 配置：存储类别的路径映射
#
# 池有哪些成员**不在配置里声明**——完全由信号量组 vpath:free-gb:<pool>
# 决定，由管理员用 sema 文件导入：
#   scalebox semaphore create --app-id=$app_id --sema-file preload.sema
#   scalebox semaphore create --app-id=$app_id --sema-file mwa.sema
#
# 原 vpath0.yaml（旧实现配置）中 weight: 0.0 的条目在此不再出现——要排除某个目标时整条删掉。

pools:
  preload:
    strategy: max-free          # 分配时选剩余量最大的成员
  mwa:
    strategy: max-free

classes:
  preload-tar:                  # 预加载 tar，每份 11GB
    unit_size_gb: 11
    targets:
      - pool: preload
        weight: 1.0

  global-dat:                   # 共享存储上的计算文件，每份 50GB
    unit_size_gb: 50
    targets:
      - pool: mwa
        weight: 1.0

  staging-24ch:                 # 24 通道波束合成：读已存在的共享位置，不分配
    targets:
      - path: "astro@10.100.1.30:10022/data2/mydata"
        weight: 1.0
